<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoJoiner Companion</title>
  <link rel="stylesheet" href="popup.css" />
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">R<span></span></div>
    <div class="brand-copy"><strong>RoJoiner</strong><small>Firefox companion</small></div>
    <button id="refresh" class="icon-button" type="button" title="Refresh friends" aria-label="Refresh friends">↻</button>
  </header>

  <main>
    <div id="status" class="status">Loading your Roblox friends…</div>

    <section id="identity" class="identity" hidden></section>

    <section id="workspace" hidden>
      <div class="summary-row">
        <div><span id="online-count">0</span><small>friends</small></div>
        <div><span id="joinable-count">0</span><small>in game</small></div>
        <div class="session-state"><i></i><span>Session local</span></div>
      </div>

      <div class="controls">
        <div class="segments" role="tablist" aria-label="Friend filters">
          <button class="segment active" data-mode="joinable" type="button" role="tab" aria-selected="true">In game</button>
          <button class="segment" data-mode="all" type="button" role="tab" aria-selected="false">All friends</button>
        </div>
        <input id="filter" type="search" placeholder="Filter friends" autocomplete="off" />
      </div>

      <section id="friends" class="friends" aria-live="polite"></section>
    </section>
  </main>

  <footer>
    <span>Uses your local Roblox session only.</span>
    <a href="https://github.com/xtofuub/RoJoiner/tree/main/companion" target="_blank" rel="noreferrer">Source ↗</a>
  </footer>
</body>
</html>
