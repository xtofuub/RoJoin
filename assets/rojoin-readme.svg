<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">RoJoin</title>
  <description id="description">Public Roblox server finder and direct launcher.</description>

  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="76%">
      <stop offset="0" stop-color="#18100e" />
      <stop offset="0.52" stop-color="#0a0807" />
      <stop offset="1" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff846f" />
      <stop offset="1" stop-color="#ff5f45" />
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="32" />
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.026" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)" />
  <rect width="1200" height="420" rx="30" fill="url(#grid)" />

  <circle cx="600" cy="205" r="132" fill="#ff6b50" opacity="0.10" filter="url(#softGlow)" />
  <circle cx="600" cy="205" r="126" fill="none" stroke="#ffffff" stroke-opacity="0.055" />
  <circle cx="600" cy="205" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.035" />

  <g transform="translate(72 66)">
    <rect width="42" height="42" rx="10" fill="#f4f4f4" />
    <text x="21" y="29" text-anchor="middle" fill="#090909" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900">R.</text>
    <text x="62" y="27" fill="#8a8a8a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">PUBLIC PRESENCE TOOL</text>
  </g>

  <g transform="translate(910 66)">
    <rect width="218" height="42" rx="21" fill="#111111" stroke="#ffffff" stroke-opacity="0.11" />
    <circle cx="24" cy="21" r="5" fill="#55d187" />
    <text x="43" y="26" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">OPEN SOURCE</text>
  </g>

  <text x="600" y="222" text-anchor="middle" fill="#f5f5f5" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="138" font-weight="900" letter-spacing="-10">ROJOIN</text>
  <rect x="423" y="250" width="354" height="4" rx="2" fill="url(#accent)" />
  <text x="600" y="298" text-anchor="middle" fill="#969696" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="5">FIND THE SERVER. JOIN THE GAME.</text>

  <line x1="72" y1="352" x2="1128" y2="352" stroke="#ffffff" stroke-opacity="0.085" />
  <text x="72" y="386" fill="#686868" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ROBLOX PUBLIC SERVER FINDER</text>
  <text x="1128" y="386" text-anchor="end" fill="#ff6b50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PUBLIC DATA / DIRECT LAUNCH</text>
</svg>
