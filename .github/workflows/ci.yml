name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: npm run check
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('companion/manifest.json', 'utf8')); console.log('manifest ok')"
